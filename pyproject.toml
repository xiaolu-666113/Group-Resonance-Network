[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-resonance-network"
version = "0.1.0"
description = "Group Resonance Network (GRN) for cross-subject EEG emotion recognition"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GRN Research Code"}]
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.2.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0.0",
  "tqdm>=4.65.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
